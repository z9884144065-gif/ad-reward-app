<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Смотреть рекламу</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #ffffff);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 22px; margin-bottom: 12px; text-align: center; }
    p  { font-size: 15px; opacity: 0.7; margin-bottom: 24px; text-align: center; }
    button {
      background: var(--tg-theme-button-color, #2ea6ff);
      color: var(--tg-theme-button-text-color, #fff);
      border: none;
      padding: 16px 32px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
      min-height: 20px;
    }
    .ok  { color: #4caf50; }
    .err { color: #f44336; }
  </style>
</head>
<body>

  <h1>🎬 Заработай TUSD</h1>
  <p>Смотри рекламу и получай награду на свой баланс</p>

  <button id="watch">Смотреть рекламу</button>
  <div id="status"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const EDGE_URL = 'https://jutszxuzjzyfxarceydw.supabase.co/functions/v1/ad-reward';

    const btn = document.getElementById('watch');
    const status = document.getElementById('status');

    function setStatus(text, cls = '') {
      status.textContent = text;
      status.className = cls;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      setStatus('Показываем рекламу...');

      await new Promise(r => setTimeout(r, 3000));

      try {
        const res = await fetch(EDGE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData,
            source: 'test',
            zoneId: null,
          }),
        });

        const data = await res.json();

        if (data.ok) {
          setStatus(`✅ Начислено ${data.amount} TUSD (сегодня ${data.today}/${data.limit})`, 'ok');
          tg.HapticFeedback?.notificationOccurred('success');
        } else {
          const reasons = {
            cooldown: `Подожди ещё ${data.wait_seconds} сек.`,
            daily_limit: `Дневной лимит: ${data.today}/${data.limit}`,
            invalid_init_data: 'Ошибка авторизации Telegram',
            bot_token_missing: 'Секрет BOT_TOKEN не настроен',
            settings_missing: 'Настройки рекламы не найдены',
          };
          setStatus(`❌ ${reasons[data.reason] || data.reason}`, 'err');
          tg.HapticFeedback?.notificationOccurred('error');
        }
      } catch (e) {
        setStatus('❌ Ошибка сети: ' + e.message, 'err');
      }

      btn.disabled = false;
    });
  </script>

</body>
</html>
